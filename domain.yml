version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - mood_great
  - mood_unhappy
  - bot_challenge
  - ask_weather
  - ask_news
  - ask_crypto
  - server_health
  - speed_test
  - list_habits
  - list_todos
  - list_notes
  - ask_jobs
  - ask_scholarships
  - ask_psu_jobs
  - search_vacancies
  - subscribe_alerts
  - unsubscribe_alerts
  - set_alert_format
  - ask_help
  - nlu_fallback

responses:
  utter_greet:
  - text: "Namaste! Kaise ho aap? Main aapki kya help kar sakti hu?"
  - text: "Hey there! Kya haal chaal? Batao aaj kya plan hai?"

  utter_cheer_up:
  - text: "Arre tension mat lo yaar! Ye dekho, mood ekdum refresh ho jayega:"
    image: "https://i.imgur.com/nGF1K8f.jpg"

  utter_did_that_help:
  - text: "Thoda better feel hua kya?"

  utter_happy:
  - text: "Zabardast! Mast raho aur batate raho agar koi bhi help chahiye."

  utter_goodbye:
  - text: "Alvida dost! Phir milenge, apna dhyan rakhna!"
  - text: "Chalo bye bye! Milte hai baad me!"

  utter_iamabot:
  - text: "Main Alya hu, ek smart AI assistant powered by Rasa & Groq LLM, equipped with 37+ skills! Aapki help ke liye hamesha ready."

actions:
  - action_llm_response
  - action_get_weather
  - action_get_news
  - action_get_crypto
  - action_server_health
  - action_speed_test
  - action_list_habits
  - action_list_todos
  - action_list_notes
  - action_get_jobs
  - action_get_scholarships
  - action_get_psu_jobs
  - action_search_vacancies
  - action_subscribe_alerts
  - action_unsubscribe_alerts
  - action_set_alert_format

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
