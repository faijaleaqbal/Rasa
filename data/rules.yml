version: "3.1"

rules:

- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Handle weather query directly
  steps:
  - intent: ask_weather
  - action: action_get_weather

- rule: Handle news query directly
  steps:
  - intent: ask_news
  - action: action_get_news

- rule: Handle crypto query directly
  steps:
  - intent: ask_crypto
  - action: action_get_crypto

- rule: Handle server health query directly
  steps:
  - intent: server_health
  - action: action_server_health

- rule: Handle speed test directly
  steps:
  - intent: speed_test
  - action: action_speed_test

- rule: Handle list habits directly
  steps:
  - intent: list_habits
  - action: action_list_habits

- rule: Handle list todos directly
  steps:
  - intent: list_todos
  - action: action_list_todos

- rule: Handle list notes directly
  steps:
  - intent: list_notes
  - action: action_list_notes

- rule: Handle jobs query directly
  steps:
  - intent: ask_jobs
  - action: action_get_jobs

- rule: Handle scholarships query directly
  steps:
  - intent: ask_scholarships
  - action: action_get_scholarships

- rule: Handle psu jobs query directly
  steps:
  - intent: ask_psu_jobs
  - action: action_get_psu_jobs

- rule: Handle search vacancies directly
  steps:
  - intent: search_vacancies
  - action: action_search_vacancies

- rule: Handle subscribe alerts directly
  steps:
  - intent: subscribe_alerts
  - action: action_subscribe_alerts

- rule: Handle unsubscribe alerts directly
  steps:
  - intent: unsubscribe_alerts
  - action: action_unsubscribe_alerts

- rule: Handle set alert format directly
  steps:
  - intent: set_alert_format
  - action: action_set_alert_format

- rule: Handle help query directly
  steps:
  - intent: ask_help
  - action: action_llm_response

- rule: Fallback routing to LLM response
  steps:
  - intent: nlu_fallback
  - action: action_llm_response
